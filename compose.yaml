services:
  search01:
    image: ${OPENSEARCH_IMAGE:-ghcr.io/codelibs/fess-opensearch:${OPENSEARCH_VERSION:-3.8.0}}
    container_name: search01
    restart: always
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-search
      - bootstrap.memory_lock=true
      # No `ml` role: embeddings come from the CLIP server, not ML Commons.
      - node.roles=cluster_manager,data,ingest
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      # Bind to host loopback only: OpenSearch here runs with security disabled.
      # Inter-container traffic uses the docker network (search01:9200); this publish
      # is only for host-local debugging. Do not expose 9200 on a public interface.
      - "127.0.0.1:9200:9200"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - multimodal_net

  clip_server:
    build:
      context: ./docker/clip-server
    image: ${CLIP_SERVER_IMAGE:-docker-multimodalsearch/clip-server:local}
    container_name: clip_server
    restart: always
    # Run as non-root; set CLIP_UID/CLIP_GID to the host user that owns the
    # bind-mounted model cache (./data/clip_server/cache) so it stays writable.
    # Defaults to 1000:1000, matching the image's built-in "clip" user.
    user: "${CLIP_UID:-1000}:${CLIP_GID:-1000}"
    environment:
      CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-xlm-roberta-base-ViT-B-32::laion5b-s13b-b90k}
      MULTIMODAL_DIMENSION: ${MULTIMODAL_DIMENSION:-512}
      CLIP_DEVICE: ${CLIP_DEVICE:-cpu}
      CLIP_MAX_IMAGE_PIXELS: ${CLIP_MAX_IMAGE_PIXELS:-64000000}
      HF_HOME: /cache/huggingface
    volumes:
      - ./data/clip_server/cache:/cache
    networks:
      - multimodal_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:51000/health').status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  content:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: content
    restart: always
    volumes:
      - ./data/content:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - multimodal_net

  fess01:
    # The -noble variant is REQUIRED: it carries imagemagick/unoconv/poppler-utils,
    # which generate-thumbnail needs. The default alpine image has none of them and
    # the gallery grid would render without a single thumbnail.
    image: ${FESS_IMAGE:-ghcr.io/codelibs/fess:${FESS_VERSION:-15.8.0}-noble}
    container_name: fess01
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_healthy
      clip_server:
        condition: service_healthy
      content:
        condition: service_healthy
    environment:
      SEARCH_ENGINE_HTTP_URL: "http://search01:9200"
      # Trailing slash is REQUIRED: Fess builds analyzer keywords_path values by
      # concatenating this prefix with e.g. "ar/protwords.txt"; without the slash it
      # resolves to ".../dictionaryar/protwords.txt" and OpenSearch analyzer creation
      # (SuggestHelper) fails with "keywords_path: file not readable".
      FESS_DICTIONARY_PATH: "/usr/share/opensearch/config/dictionary/"
      FESS_PLUGINS: "${FESS_PLUGINS-fess-webapp-multimodal:15.8.0}"
      # Two config channels are in play here:
      #   -Dfess.config.*  -> fess_config.properties overrides
      #   -Dfess.system.*  -> system.properties channel (FessProp#getSystemProperty).
      # Every content_chunker.* key MUST use the -Dfess.system.* form; the core reads
      # them through getSystemProperty and silently ignores -Dfess.config.content_chunker.*.
      # Do not put content_chunker.* into data/fess/opt/fess/system.properties either:
      # file values WIN over -Dfess.system.* (FessProp.java:176-178), which would make
      # the .env-driven values here dead.
      # No job.system.property.filter.pattern is needed: ExecJob forwards the
      # fess.system.* prefix to crawler/thumbnail child processes automatically.
      # rank.fusion.searchers is intentionally left unset so the default (keyword)
      # and multi_modal (CLIP) searchers are combined via hybrid rank fusion.
      FESS_JAVA_OPTS: >-
        -Xms${FESS_HEAP:-1g} -Xmx${FESS_HEAP:-1g}
        -Dfess.config.crawler.document.cache.enabled=false
        -Dfess.config.adaptive.load.control=0
        -Dfess.config.query.facet.fields=label,host
        -Dfess.config.query.additional.api.response.fields=searcher
        -Dfess.config.paging.search.page.size=${SEARCH_PAGE_SIZE:-20}
        -Dfess.config.index.user.initial_password=${FESS_ADMIN_PASSWORD:-admin}
        -Dfess.config.thumbnail.html.image.thumbnail.width=${THUMBNAIL_PX:-512}
        -Dfess.config.thumbnail.html.image.thumbnail.height=${THUMBNAIL_PX:-512}
        -Dfess.system.content_chunker.enabled=true
        -Dfess.system.content_chunker.search.enabled=true
        -Dfess.system.content_chunker.embedding.name=clip
        -Dfess.system.content_chunker.embedding.dimension=${MULTIMODAL_DIMENSION:-512}
        -Dfess.system.content_chunker.embedding.clip.api.url=http://clip_server:51000
        -Dfess.system.content_chunker.search.knn.method=hnsw
        -Dfess.system.content_chunker.search.knn.engine=${KNN_ENGINE:-lucene}
        -Dfess.system.content_chunker.search.knn.space_type=cosinesimil
        -Dfess.system.content_chunker.search.knn.k=${KNN_K:-100}
        -Dfess.system.content_chunker.search.min_score=${CLIP_MIN_COSINE:-0.12}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      - ./data/fess/usr/share/fess/app/themes/${THEME_NAME:-mosaic}:/usr/share/fess/app/themes/${THEME_NAME:-mosaic}
      # generate-thumbnail with image_size rewritten to ${THUMBNAIL_SIZE}; the shipped
      # script hardcodes 100x100, which is too small for a thumbnail-first gallery.
      # Generated by bin/setup.sh from the pinned image. NOTE: this script only
      # covers command-based generation (images, PDF, Office). HTML-page thumbnails
      # are produced in Java by HtmlTagBasedGenerator, whose own default is 100x100 --
      # that is what thumbnail.html.image.thumbnail.* above raises.
      - ./data/fess/bin/generate-thumbnail:/usr/share/fess/bin/generate-thumbnail:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - multimodal_net

  # One-shot: after fess01 is healthy, verify that the document index carries the
  # core's content_chunk_vector kNN mapping at the configured dimension/engine.
  # Fess 15.8 bakes that mapping in statically when it creates the index, so there is
  # no reindex workaround any more (15.7's init-fess-index.sh is gone) — this only
  # fails fast when the index predates the configuration. See bin/init-fess-verify.sh.
  init-fess-verify:
    image: ${ALPINE_IMAGE:-alpine:3.21}
    depends_on:
      fess01:
        condition: service_healthy
    environment:
      - SEARCH_ENGINE_HTTP_URL=http://search01:9200
      - MULTIMODAL_DIMENSION=${MULTIMODAL_DIMENSION:-512}
      - KNN_ENGINE=${KNN_ENGINE:-lucene}
      - MAX_WAIT=${CHUNK_SETUP_MAX_WAIT:-300}
    volumes:
      - ./bin/init-fess-verify.sh:/init-fess-verify.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /init-fess-verify.sh"]
    restart: "no"
    networks:
      - multimodal_net

networks:
  multimodal_net:
    driver: bridge
